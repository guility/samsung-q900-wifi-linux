[package]
name = "q900-web-ui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.8", features = ["json"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Event", "HtmlInputElement", "HtmlSelectElement", "Storage", "Window"] }
yew = { version = "0.23", features = ["csr"] }
