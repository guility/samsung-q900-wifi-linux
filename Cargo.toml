[package]
name = "q900-bridge"
version = "0.1.0"
edition = "2024"
default-run = "q900-bridge"
description = "Experimental multichannel PipeWire RTP bridge for Linux"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
ctrlc = "3.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
q900-web-ui = { path = "web-ui" }

[workspace]
members = ["web-ui"]
resolver = "3"
